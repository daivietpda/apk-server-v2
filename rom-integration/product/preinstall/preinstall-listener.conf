#!/system/bin/sh

MARK=/sdcard/Android/data/com.daivietpda.preinstallmanager/files/run
PAYLOAD=/product/preinstall/factoryreset.conf
LOG=/data/local/tmp/product_preinstall.log
REMOTE_HELPER=/system/framework/remote-preinstall.jar
TELEMETRY_TOKEN=/product/preinstall/telemetry.key
TELEMETRY_QUEUE=/data/local/tmp/preinstall-v2-telemetry
ENROLLMENT_EVENT_FILE=${TELEMETRY_QUEUE}/enrollment.event
ENROLLMENT_SENT_MARK=/data/local/tmp/.preinstall_v2_telemetry_registered
DEVICE_ID_FILE=/data/local/tmp/.preinstall_v2_device_id
MAC_ADDRESS_FILE=/data/local/tmp/.preinstall_v2_mac_address
TIMEOUT=/system/bin/timeout
AWK=/system/bin/awk
LOOP_SECONDS=3
TELEMETRY_BACKOFF=30
TELEMETRY_RETRY_AT=0
FACTORY_PID=""

log_listener() {
    echo "$(date '+%Y-%m-%d %H:%M:%S') listener: $*" >> "${LOG}"
}

telemetry_text() {
    printf '%s' "$1" | tr -d '\r\n|' | cut -c 1-240
}

valid_mac() {
    echo "$1" | grep -Eq '^[0-9a-fA-F]{2}(:[0-9a-fA-F]{2}){5}$' || return 1
    [ "$1" != "00:00:00:00:00:00" ] || return 1
    [ "$1" != "ff:ff:ff:ff:ff:ff" ] || return 1
}

wifi_mac_address() {
    wifi_mac=$(dumpsys wifi 2>/dev/null | "${AWK}" -F'MAC: ' '/MAC:/{split($2, fields, ","); print fields[1]; exit}' \
        | tr 'A-F' 'a-f' | tr -d ' \r\n\t')
    valid_mac "${wifi_mac}" || return 1
    printf '%s' "${wifi_mac}"
}

ensure_device_identity() {
    MAC_ADDRESS=""
    DEVICE_ID=""

    candidate=$(wifi_mac_address 2>/dev/null)
    if valid_mac "${candidate}"; then
        MAC_ADDRESS=$(printf '%s' "${candidate}" | tr 'A-F' 'a-f')
    fi
    for interface_name in wlan0 eth0; do
        [ -z "${MAC_ADDRESS}" ] || break
        address_file="/sys/class/net/${interface_name}/address"
        [ -r "${address_file}" ] || continue
        candidate=$(head -n 1 "${address_file}" 2>/dev/null | tr 'A-F' 'a-f' | tr -d '\r\n')
        valid_mac "${candidate}" || continue
        MAC_ADDRESS="${candidate}"
    done
    if [ -z "${MAC_ADDRESS}" ] && [ -f "${MAC_ADDRESS_FILE}" ]; then
        candidate=$(head -n 1 "${MAC_ADDRESS_FILE}" 2>/dev/null | tr 'A-F' 'a-f' | tr -d '\r\n')
        valid_mac "${candidate}" && MAC_ADDRESS="${candidate}"
    fi

    existing_device_id=""
    if [ -f "${DEVICE_ID_FILE}" ]; then
        existing_device_id=$(head -n 1 "${DEVICE_ID_FILE}" 2>/dev/null | tr -d '\r\n')
        echo "${existing_device_id}" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$' || existing_device_id=""
    fi

    if [ -n "${existing_device_id}" ]; then
        # Keep the legacy UUID so a MAC repair updates the existing D1 row.
        DEVICE_ID="${existing_device_id}"
    elif [ -n "${MAC_ADDRESS}" ]; then
        mac_hex=$(printf '%s' "${MAC_ADDRESS}" | tr -d ':')
        DEVICE_ID="00000000-0000-4000-8000-${mac_hex}"
    fi

    if [ -z "${DEVICE_ID}" ]; then
        DEVICE_ID=$(head -n 1 /proc/sys/kernel/random/uuid 2>/dev/null | tr -d '\r\n')
        if ! echo "${DEVICE_ID}" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            random_hash=$(printf '%s' "$(date '+%s%N')-$$" | /system/bin/sha256sum 2>/dev/null | /system/bin/awk '{print $1}')
            [ "${#random_hash}" -ge 32 ] || return 1
            DEVICE_ID="$(echo "${random_hash}" | cut -c1-8)-$(echo "${random_hash}" | cut -c9-12)-$(echo "${random_hash}" | cut -c13-16)-$(echo "${random_hash}" | cut -c17-20)-$(echo "${random_hash}" | cut -c21-32)"
        fi
    fi

    printf '%s\n' "${DEVICE_ID}" > "${DEVICE_ID_FILE}.tmp" 2>/dev/null && mv "${DEVICE_ID_FILE}.tmp" "${DEVICE_ID_FILE}" 2>/dev/null
    chmod 600 "${DEVICE_ID_FILE}" 2>/dev/null
    [ -f "${DEVICE_ID_FILE}" ]
}

queue_mac_repair() {
    [ -f "${ENROLLMENT_SENT_MARK}" ] || return 0
    valid_mac "${MAC_ADDRESS}" || return 0
    [ -f "${ENROLLMENT_EVENT_FILE}" ] && return 0
    previous_mac=$(head -n 1 "${MAC_ADDRESS_FILE}" 2>/dev/null | tr 'A-F' 'a-f' | tr -d '\r\n')
    [ "${previous_mac}" = "${MAC_ADDRESS}" ] && return 0
    printf '%s\n' "" > "${ENROLLMENT_EVENT_FILE}.tmp" 2>/dev/null || return 1
    mv "${ENROLLMENT_EVENT_FILE}.tmp" "${ENROLLMENT_EVENT_FILE}" 2>/dev/null || return 1
    if ! rm -f "${ENROLLMENT_SENT_MARK}"; then
        rm -f "${ENROLLMENT_EVENT_FILE}"
        return 1
    fi
    log_listener "telemetry MAC repair queued"
}

purge_unused_events() {
    mkdir -p "${TELEMETRY_QUEUE}" 2>/dev/null || return 0
    for event_file in "${TELEMETRY_QUEUE}"/*.event; do
        [ -f "${event_file}" ] || continue
        [ "${event_file}" = "${ENROLLMENT_EVENT_FILE}" ] || rm -f "${event_file}"
    done
    [ -f "${ENROLLMENT_SENT_MARK}" ] && rm -f "${ENROLLMENT_EVENT_FILE}"
}

post_enrollment() {
    [ -f "${ENROLLMENT_EVENT_FILE}" ] || return 0
    release_id=$(head -n 1 "${ENROLLMENT_EVENT_FILE}" 2>/dev/null | tr -d '\r\n' | cut -c 1-96)
    event_time=$(date '+%s' 2>/dev/null)
    echo "${event_time}" | grep -Eq '^[0-9]{10}$' || return 1
    MODEL=$(telemetry_text "$(getprop ro.product.model 2>/dev/null)")
    SDK=$(getprop ro.build.version.sdk 2>/dev/null | tr -cd '0-9')
    ROM_VERSION=$(telemetry_text "$(getprop ro.build.version.incremental 2>/dev/null)")
    telemetry_output=$(CLASSPATH="${REMOTE_HELPER}" "${TIMEOUT}" 20 /system/bin/app_process /system/bin TelemetryV2 --enroll \
        "${DEVICE_ID}" "${MAC_ADDRESS}" "${event_time}" "${release_id}" \
        "${MODEL}" "${SDK}" "${ROM_VERSION}" 2>&1)
    telemetry_result=$?
    if [ "${telemetry_result}" -eq 0 ]; then
        if valid_mac "${MAC_ADDRESS}"; then
            printf '%s\n' "${MAC_ADDRESS}" > "${MAC_ADDRESS_FILE}.tmp" 2>/dev/null || return 1
            mv "${MAC_ADDRESS_FILE}.tmp" "${MAC_ADDRESS_FILE}" 2>/dev/null || return 1
            chmod 600 "${MAC_ADDRESS_FILE}" 2>/dev/null
        fi
        touch "${ENROLLMENT_SENT_MARK}" 2>/dev/null || return 1
        rm -f "${ENROLLMENT_EVENT_FILE}"
        log_listener "telemetry initial preinstall registered"
        return 0
    fi
    log_listener "telemetry enrollment deferred result=${telemetry_result}"
    return 1
}

drain_telemetry() {
    ensure_device_identity || return 0
    queue_mac_repair
    [ -f "${ENROLLMENT_SENT_MARK}" ] && return 0
    [ -f "${ENROLLMENT_EVENT_FILE}" ] || return 0
    [ -r "${REMOTE_HELPER}" ] && [ -r "${TELEMETRY_TOKEN}" ] || return 0
    now=$(date '+%s')
    [ "${now}" -ge "${TELEMETRY_RETRY_AT}" ] || return 0
    if post_enrollment; then
        TELEMETRY_BACKOFF=30
    else
        TELEMETRY_RETRY_AT=$((now + TELEMETRY_BACKOFF))
        TELEMETRY_BACKOFF=$((TELEMETRY_BACKOFF * 2))
        [ "${TELEMETRY_BACKOFF}" -le 900 ] || TELEMETRY_BACKOFF=900
    fi
}

check_factoryreset_child() {
    [ -n "${FACTORY_PID}" ] || return 0
    kill -0 "${FACTORY_PID}" 2>/dev/null && return 0
    wait "${FACTORY_PID}"
    result=$?
    log_listener "factoryreset payload finished result=${result} pid=${FACTORY_PID}"
    FACTORY_PID=""
}

start_factoryreset_child() {
    /system/bin/sh "${PAYLOAD}" &
    FACTORY_PID=$!
    log_listener "factoryreset payload started pid=${FACTORY_PID}"
}

purge_unused_events
ensure_device_identity || log_listener "telemetry device identity is unavailable"
if [ ! -r "${TELEMETRY_TOKEN}" ]; then
    log_listener "telemetry disabled: token missing or unreadable"
elif [ ! -r "${REMOTE_HELPER}" ]; then
    log_listener "telemetry disabled: helper missing or unreadable"
fi
log_listener "started uid=$(id -u) context=$(id -Z 2>/dev/null)"
while true; do
    check_factoryreset_child
    drain_telemetry
    if [ -f "${MARK}" ]; then
        if rm -f "${MARK}"; then
            if [ -n "${FACTORY_PID}" ] || [ "$(getprop init.svc.factoryreset 2>/dev/null)" = running ]; then
                log_listener "request ignored: factoryreset is already running"
            elif [ -r "${PAYLOAD}" ]; then
                log_listener "request received"
                start_factoryreset_child
            else
                log_listener "payload missing or unreadable: ${PAYLOAD}"
            fi
        else
            log_listener "cannot remove request marker"
        fi
    fi
    sleep "${LOOP_SECONDS}"
done
