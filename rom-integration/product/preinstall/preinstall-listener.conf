#!/system/bin/sh

MARK=/sdcard/Android/data/com.daivietpda.preinstallmanager/files/run
PAYLOAD=/product/preinstall/factoryreset.conf
LOG=/data/local/tmp/product_preinstall.log
REMOTE_HELPER=/system/framework/remote-preinstall.jar
TELEMETRY_TOKEN=/product/preinstall/telemetry.key
TELEMETRY_QUEUE=/data/local/tmp/preinstall-v2-telemetry
DEVICE_ID_FILE=/data/local/tmp/.preinstall_v2_device_id
TIMEOUT=/system/bin/timeout
LOOP_SECONDS=3
HEARTBEAT_SECONDS=300
MAX_SEND_PER_LOOP=5
TELEMETRY_BACKOFF=30
TELEMETRY_RETRY_AT=0
LISTENER_SEQUENCE=0
FACTORY_PID=""

log_listener() {
    echo "$(date '+%Y-%m-%d %H:%M:%S') listener: $*" >> "${LOG}"
}

telemetry_text() {
    printf '%s' "$1" | tr -d '\r\n|' | cut -c 1-240
}

ensure_device_id() {
    if [ -f "${DEVICE_ID_FILE}" ]; then
        DEVICE_ID=$(head -n 1 "${DEVICE_ID_FILE}" 2>/dev/null | tr -d '\r\n')
        echo "${DEVICE_ID}" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$' && return 0
    fi
    DEVICE_ID=$(head -n 1 /proc/sys/kernel/random/uuid 2>/dev/null | tr -d '\r\n')
    if ! echo "${DEVICE_ID}" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
        random_hash=$(printf '%s' "$(date '+%s%N')-$$" | /system/bin/sha256sum 2>/dev/null | /system/bin/awk '{print $1}')
        [ "${#random_hash}" -ge 32 ] || return 1
        DEVICE_ID="$(echo "${random_hash}" | cut -c1-8)-$(echo "${random_hash}" | cut -c9-12)-$(echo "${random_hash}" | cut -c13-16)-$(echo "${random_hash}" | cut -c17-20)-$(echo "${random_hash}" | cut -c21-32)"
    fi
    printf '%s\n' "${DEVICE_ID}" > "${DEVICE_ID_FILE}.tmp" 2>/dev/null && mv "${DEVICE_ID_FILE}.tmp" "${DEVICE_ID_FILE}" 2>/dev/null
    chmod 600 "${DEVICE_ID_FILE}" 2>/dev/null
    [ -f "${DEVICE_ID_FILE}" ]
}

queue_heartbeat() {
    [ -r "${TELEMETRY_TOKEN}" ] || return 0
    mkdir -p "${TELEMETRY_QUEUE}" 2>/dev/null || return 0
    LISTENER_SEQUENCE=$((LISTENER_SEQUENCE + 1))
    event_time=$(date '+%s')
    event_file="${TELEMETRY_QUEUE}/${event_time}-listener-$$-${LISTENER_SEQUENCE}.event"
    printf '%s|heartbeat||||||||Heartbeat\n' "${event_time}" > "${event_file}.tmp" 2>/dev/null && mv "${event_file}.tmp" "${event_file}" 2>/dev/null
}

post_event_file() {
    event_file="$1"
    IFS='|' read -r event_time event run_id event_state event_phase package_name version_code release_id selected_endpoint event_message < "${event_file}" || return 1
    # Worker accepts signed timestamps only within 10 minutes. A device can
    # queue events before network time is synchronized; discard those stale
    # entries so one old event cannot block all later telemetry.
    if ! echo "${event_time}" | grep -Eq '^[0-9]{10}$'; then
        rm -f "${event_file}"
        log_listener "telemetry discarded invalid queue event=${event}"
        return 2
    fi
    current_time=$(date '+%s' 2>/dev/null)
    case "${current_time}" in
        ''|*[!0-9]*) return 1 ;;
    esac
    event_age=$((current_time - event_time))
    if [ "${event_age}" -gt 540 ] || [ "${event_age}" -lt -540 ]; then
        rm -f "${event_file}"
        log_listener "telemetry discarded stale queue event=${event} age=${event_age}"
        return 2
    fi
    MODEL=$(telemetry_text "$(getprop ro.product.model 2>/dev/null)")
    SDK=$(getprop ro.build.version.sdk 2>/dev/null | tr -cd '0-9')
    ROM_VERSION=$(telemetry_text "$(getprop ro.build.version.incremental 2>/dev/null)")
    telemetry_output=$(CLASSPATH="${REMOTE_HELPER}" "${TIMEOUT}" 20 /system/bin/app_process /system/bin TelemetryV2 --post \
        "${DEVICE_ID}" "${event}" "${event_time}" "${run_id}" "${event_state}" "${event_phase}" \
        "${package_name}" "${version_code}" "${release_id}" "${selected_endpoint}" "${event_message}" \
        "${MODEL}" "${SDK}" "${ROM_VERSION}" 2>&1)
    telemetry_result=$?
    if [ "${telemetry_result}" -eq 0 ]; then
        rm -f "${event_file}"
        log_listener "telemetry sent event=${event}"
        return 0
    fi
    log_listener "telemetry deferred event=${event} result=${telemetry_result}"
    return 1
}

drain_telemetry() {
    [ -r "${REMOTE_HELPER}" ] && [ -r "${TELEMETRY_TOKEN}" ] || return 0
    ensure_device_id || return 0
    now=$(date '+%s')
    [ "${now}" -ge "${TELEMETRY_RETRY_AT}" ] || return 0
    sent=0
    for event_file in "${TELEMETRY_QUEUE}"/*.event; do
        [ -f "${event_file}" ] || continue
        if post_event_file "${event_file}"; then
            TELEMETRY_BACKOFF=30
            sent=$((sent + 1))
            [ "${sent}" -ge "${MAX_SEND_PER_LOOP}" ] && break
        else
            telemetry_result=$?
            # Invalid legacy files have been discarded; continue draining
            # rather than applying network backoff to valid later events.
            [ "${telemetry_result}" -eq 2 ] && continue
            TELEMETRY_RETRY_AT=$((now + TELEMETRY_BACKOFF))
            TELEMETRY_BACKOFF=$((TELEMETRY_BACKOFF * 2))
            [ "${TELEMETRY_BACKOFF}" -le 900 ] || TELEMETRY_BACKOFF=900
            break
        fi
    done
}

check_factoryreset_child() {
    [ -n "${FACTORY_PID}" ] || return 0
    kill -0 "${FACTORY_PID}" 2>/dev/null && return 0
    wait "${FACTORY_PID}"
    result=$?
    log_listener "factoryreset payload finished result=${result} pid=${FACTORY_PID}"
    FACTORY_PID=""
}

start_factoryreset_child() {
    /system/bin/sh "${PAYLOAD}" &
    FACTORY_PID=$!
    log_listener "factoryreset payload started pid=${FACTORY_PID}"
}

mkdir -p "${TELEMETRY_QUEUE}" 2>/dev/null
ensure_device_id || log_listener "telemetry device ID is unavailable"
if [ ! -r "${TELEMETRY_TOKEN}" ]; then
    log_listener "telemetry disabled: token missing or unreadable"
elif [ ! -r "${REMOTE_HELPER}" ]; then
    log_listener "telemetry disabled: helper missing or unreadable"
fi
log_listener "started uid=$(id -u) context=$(id -Z 2>/dev/null)"
NEXT_HEARTBEAT=0
while true; do
    now=$(date '+%s')
    if [ "${now}" -ge "${NEXT_HEARTBEAT}" ]; then
        queue_heartbeat
        NEXT_HEARTBEAT=$((now + HEARTBEAT_SECONDS))
    fi
    check_factoryreset_child
    drain_telemetry
    if [ -f "${MARK}" ]; then
        if rm -f "${MARK}"; then
            if [ -n "${FACTORY_PID}" ] || [ "$(getprop init.svc.factoryreset 2>/dev/null)" = running ]; then
                log_listener "request ignored: factoryreset is already running"
            elif [ -r "${PAYLOAD}" ]; then
                log_listener "request received"
                start_factoryreset_child
            else
                log_listener "payload missing or unreadable: ${PAYLOAD}"
            fi
        else
            log_listener "cannot remove request marker"
        fi
    fi
    sleep "${LOOP_SECONDS}"
done
