#!/system/bin/sh

MARK=/sdcard/Android/data/com.daivietpda.preinstallmanager/files/run
PAYLOAD=/product/preinstall/factoryreset.conf
LOG=/data/local/tmp/product_preinstall.log

log_listener() {
    echo "$(date '+%Y-%m-%d %H:%M:%S') listener: $*" >> "${LOG}"
}

log_listener "started uid=$(id -u) context=$(id -Z 2>/dev/null)"
while true; do
    if [ -f "${MARK}" ]; then
        if rm -f "${MARK}"; then
            log_listener "request received"
            if [ -r "${PAYLOAD}" ]; then
                /system/bin/sh "${PAYLOAD}"
                result=$?
                log_listener "factoryreset payload finished result=${result}"
            else
                log_listener "payload missing or unreadable: ${PAYLOAD}"
            fi
        else
            log_listener "cannot remove request marker"
        fi
    fi
    sleep 3
done
