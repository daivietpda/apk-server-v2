#!/system/bin/sh

PKG_DIRS="/product/preinstall /system/preinstall"
LOCAL_MARK=/data/local/tmp/.product_preinstall_done
LOG=/data/local/tmp/product_preinstall.log
PM=/system/bin/pm

REMOTE_MANIFEST=https://daivietpda.github.io/apk-server-v2/manifest.json
REMOTE_URL_PREFIX=https://daivietpda.github.io/apk-server-v2/payload/
REMOTE_HELPER=/system/framework/remote-preinstall.jar
REMOTE_DIR=/data/local/tmp/remote_preinstall
REMOTE_STATE=/data/local/tmp/.remote_preinstall_manifest_sha256
REMOTE_PACKAGE_STATE=/data/local/tmp/remote_preinstall_packages
SHA256=/system/bin/sha256sum
AWK=/system/bin/awk
TIMEOUT=/system/bin/timeout
UNZIP=$(command -v unzip 2>/dev/null)

log_message() {
    echo "$(date '+%Y-%m-%d %H:%M:%S') $*" >> "${LOG}"
}

install_apk() {
    apk_path="$1"
    log_message "preinstall: installing ${apk_path}"
    if "${PM}" install -r -g "${apk_path}" >> "${LOG}" 2>&1; then
        log_message "preinstall: installed ${apk_path}"
        return 0
    fi
    log_message "preinstall: FAILED ${apk_path}"
    return 1
}

install_split_zip() {
    zip_path="$1"
    extract_dir="$2"
    if [ -z "${UNZIP}" ]; then
        log_message "preinstall: unzip command is unavailable"
        return 1
    fi
    rm -rf "${extract_dir}"
    mkdir -p "${extract_dir}" || return 1
    if ! "${UNZIP}" -o "${zip_path}" -d "${extract_dir}" >> "${LOG}" 2>&1; then
        log_message "preinstall: failed to extract ${zip_path}"
        rm -rf "${extract_dir}"
        return 1
    fi
    if [ ! -f "${extract_dir}/base.apk" ]; then
        log_message "preinstall: split ZIP has no root base.apk: ${zip_path}"
        rm -rf "${extract_dir}"
        return 1
    fi
    for split_item in "${extract_dir}"/*; do
        if [ ! -f "${split_item}" ]; then
            log_message "preinstall: split ZIP must contain flat files only: ${zip_path}"
            rm -rf "${extract_dir}"
            return 1
        fi
        case "${split_item}" in
            *.apk) ;;
            *)
                log_message "preinstall: unexpected file in split ZIP: ${split_item}"
                rm -rf "${extract_dir}"
                return 1
                ;;
        esac
    done
    set -- "${extract_dir}"/*.apk
    split_count=0
    for split_apk in "$@"; do
        [ -f "${split_apk}" ] && split_count=$((split_count + 1))
    done
    if [ "${split_count}" -lt 1 ]; then
        log_message "preinstall: split ZIP contains no APKs: ${zip_path}"
        rm -rf "${extract_dir}"
        return 1
    fi
    log_message "preinstall: creating install session for split package (${split_count} APKs) ${zip_path}"
    create_result=$("${PM}" install-create -r -g 2>&1)
    echo "${create_result}" >> "${LOG}"
    session_id=$(echo "${create_result}" | "${AWK}" -F'[][]' '/Success.*session/{print $2; exit}')
    invalid_session=$(echo "${session_id}" | tr -d '0-9')
    if [ -z "${session_id}" ] || [ -n "${invalid_session}" ]; then
        log_message "preinstall: failed to create split install session"
        rm -rf "${extract_dir}"
        return 1
    fi

    split_failed=0
    for split_apk in "$@"; do
        [ -f "${split_apk}" ] || continue
        split_name=${split_apk##*/}
        split_size=$(wc -c < "${split_apk}" 2>/dev/null)
        log_message "preinstall: writing session=${session_id} split=${split_name} size=${split_size}"
        if ! "${PM}" install-write -S "${split_size}" "${session_id}" "${split_name}" "${split_apk}" >> "${LOG}" 2>&1; then
            split_failed=1
            break
        fi
    done
    if [ "${split_failed}" -eq 0 ] && "${PM}" install-commit "${session_id}" >> "${LOG}" 2>&1; then
        log_message "preinstall: installed split package ${zip_path}"
        rm -rf "${extract_dir}"
        return 0
    fi

    "${PM}" install-abandon "${session_id}" >> "${LOG}" 2>&1
    log_message "preinstall: FAILED split package ${zip_path} session=${session_id}"
    rm -rf "${extract_dir}"
    return 1
}

install_remote_payload() {
    payload_format="$1"
    payload_path="$2"
    payload_extract_dir="$3"
    case "${payload_format}" in
        apk) install_apk "${payload_path}" ;;
        splitZip) install_split_zip "${payload_path}" "${payload_extract_dir}" ;;
        *) log_message "remote: unsupported format: ${payload_format}"; return 1 ;;
    esac
}

download_file() {
    source_url="$1"
    destination="$2"
    max_bytes="$3"
    max_attempts="$4"
    attempt=1
    while [ "${attempt}" -le "${max_attempts}" ]; do
        rm -f "${destination}.part"
        log_message "remote: download attempt ${attempt}: ${source_url}"
        if CLASSPATH="${REMOTE_HELPER}" "${TIMEOUT}" 150 /system/bin/app_process \
            /system/bin RemoteFetchV2 "${source_url}" "${destination}.part" "${max_bytes}" >> "${LOG}" 2>&1 \
            && [ -s "${destination}.part" ]; then
            mv "${destination}.part" "${destination}"
            return 0
        fi
        rm -f "${destination}.part"
        attempt=$((attempt + 1))
        sleep 15
    done
    return 1
}

log_message "preinstall: start uid=$(id -u) context=$(id -Z 2>/dev/null) selinux=$(/system/bin/getenforce 2>/dev/null)"
failed=0

# Local marker prevents reinstalling an app removed by the user after a normal reboot.
if [ ! -e "${LOCAL_MARK}" ]; then
    local_found=0
    local_failed=0
    for pkg_dir in ${PKG_DIRS}; do
        [ -d "${pkg_dir}" ] || continue
        log_message "preinstall: scanning ${pkg_dir}"
        for apk in "${pkg_dir}"/*.apk "${pkg_dir}"/*.APK; do
            [ -f "${apk}" ] || continue
            local_found=1
            install_apk "${apk}" || local_failed=1
        done
    done
    [ "${local_found}" -ne 0 ] || log_message "preinstall: no local APK files found"
    if [ "${local_failed}" -eq 0 ]; then
        touch "${LOCAL_MARK}"
        log_message "preinstall: local complete"
    else
        failed=1
        log_message "preinstall: local incomplete; retrying next boot"
    fi
else
    log_message "preinstall: local marker exists; skipping local APKs"
fi

# Remote state stores the manifest hash. An unchanged manifest is not reinstalled.
mkdir -p "${REMOTE_DIR}"
mkdir -p "${REMOTE_PACKAGE_STATE}"
MANIFEST=${REMOTE_DIR}/manifest.json
PAIRS=${REMOTE_DIR}/packages.list
UNINSTALLS=${REMOTE_DIR}/uninstall.list

if [ ! -r "${REMOTE_HELPER}" ]; then
    log_message "remote: HTTPS helper missing or unreadable: ${REMOTE_HELPER}"
    failed=1
elif ! download_file "${REMOTE_MANIFEST}" "${MANIFEST}" 1048576 3; then
    log_message "remote: manifest download failed"
    failed=1
else
    manifest_size=$(wc -c < "${MANIFEST}" 2>/dev/null)
    if [ -z "${manifest_size}" ] || [ "${manifest_size}" -gt 1048576 ]; then
        log_message "remote: invalid manifest size: ${manifest_size}"
        failed=1
    else
        manifest_hash=$("${SHA256}" "${MANIFEST}" 2>/dev/null | "${AWK}" '{print $1}')
        previous_hash=$(cat "${REMOTE_STATE}" 2>/dev/null)
        manifest_changed=1
        if [ -n "${manifest_hash}" ] && [ "${manifest_hash}" = "${previous_hash}" ]; then
            manifest_changed=0
            log_message "remote: manifest unchanged; checking enforced packages"
        fi

        "${AWK}" '
            function string_value(line) {
                sub(/^[^:]*:[[:space:]]*"/, "", line)
                sub(/"[[:space:]]*,?[[:space:]]*$/, "", line)
                return line
            }
            function scalar_value(line) {
                sub(/^[^:]*:[[:space:]]*/, "", line)
                sub(/[[:space:]]*,?[[:space:]]*$/, "", line)
                return line
            }
            /"url"[[:space:]]*:/ { url=string_value($0) }
            /"sha256"[[:space:]]*:/ { hash=string_value($0) }
            /"packageName"[[:space:]]*:/ { package_name=string_value($0) }
            /"versionCode"[[:space:]]*:/ { version_code=scalar_value($0) }
            /"format"[[:space:]]*:/ { package_format=string_value($0) }
            /"forceInstall"[[:space:]]*:/ { force_install=scalar_value($0) }
            /^[[:space:]]*}[,]?[[:space:]]*$/ && url != "" {
                if (force_install == "") force_install="false"
                if (package_format == "") package_format="apk"
                print url "|" hash "|" package_name "|" version_code "|" package_format "|" force_install
                url=""; hash=""; package_name=""; version_code=""; package_format=""; force_install=""
            }
        ' "${MANIFEST}" > "${PAIRS}"

        remote_failed=0
        remote_found=0
        remote_index=0

        "${AWK}" '
            function string_value(line) {
                sub(/^[^:]*:[[:space:]]*"/, "", line)
                sub(/"[[:space:]]*,?[[:space:]]*$/, "", line)
                return line
            }
            function scalar_value(line) {
                sub(/^[^:]*:[[:space:]]*/, "", line)
                sub(/[[:space:]]*,?[[:space:]]*$/, "", line)
                return line
            }
            /"action"[[:space:]]*:/ { action=string_value($0) }
            /"packageName"[[:space:]]*:/ { package_name=string_value($0) }
            /"enforce"[[:space:]]*:/ { enforce=scalar_value($0) }
            /"keepData"[[:space:]]*:/ { keep_data=scalar_value($0) }
            /"userId"[[:space:]]*:/ { user_id=scalar_value($0) }
            /^[[:space:]]*}[,]?[[:space:]]*$/ {
                if (action == "uninstall" && package_name != "") {
                    if (enforce == "") enforce="false"
                    if (keep_data == "") keep_data="false"
                    if (user_id == "") user_id="0"
                    print package_name "|" enforce "|" keep_data "|" user_id
                }
                action=""; package_name=""; enforce=""; keep_data=""; user_id=""
            }
        ' "${MANIFEST}" > "${UNINSTALLS}"

        exec 4< "${UNINSTALLS}"
        while IFS='|' read -r uninstall_package uninstall_enforce uninstall_keep_data uninstall_user_id <&4; do
            [ -n "${uninstall_package}" ] || continue
            invalid_package=$(echo "${uninstall_package}" | tr -d 'A-Za-z0-9._')
            invalid_user_id=$(echo "${uninstall_user_id}" | tr -d '0-9')
            if [ -n "${invalid_package}" ]; then
                log_message "remote: invalid uninstall packageName: ${uninstall_package}"
                remote_failed=1
                continue
            fi
            case "${uninstall_enforce}" in
                true|false) ;;
                *) log_message "remote: invalid uninstall enforce for ${uninstall_package}"; remote_failed=1; continue ;;
            esac
            case "${uninstall_keep_data}" in
                true|false) ;;
                *) log_message "remote: invalid uninstall keepData for ${uninstall_package}"; remote_failed=1; continue ;;
            esac
            if [ -z "${uninstall_user_id}" ] || [ -n "${invalid_user_id}" ]; then
                log_message "remote: invalid uninstall userId for ${uninstall_package}: ${uninstall_user_id}"
                remote_failed=1
                continue
            fi
            if [ "${uninstall_enforce}" = false ] && [ "${manifest_changed}" -eq 0 ]; then
                continue
            fi

            uninstall_path=$("${PM}" path --user "${uninstall_user_id}" "${uninstall_package}" 2>/dev/null)
            case "${uninstall_path}" in
                package:*) ;;
                *) log_message "remote: uninstall target already absent: ${uninstall_package} user=${uninstall_user_id}"; continue ;;
            esac

            log_message "remote: uninstalling ${uninstall_package} user=${uninstall_user_id} keepData=${uninstall_keep_data}"
            if [ "${uninstall_keep_data}" = true ]; then
                uninstall_result=$("${PM}" uninstall -k --user "${uninstall_user_id}" "${uninstall_package}" 2>&1)
            else
                uninstall_result=$("${PM}" uninstall --user "${uninstall_user_id}" "${uninstall_package}" 2>&1)
            fi
            echo "${uninstall_result}" >> "${LOG}"
            uninstall_after=$("${PM}" path --user "${uninstall_user_id}" "${uninstall_package}" 2>/dev/null)
            case "${uninstall_after}" in
                package:*) log_message "remote: FAILED uninstall ${uninstall_package} user=${uninstall_user_id}"; remote_failed=1 ;;
                *) log_message "remote: uninstalled ${uninstall_package} user=${uninstall_user_id}" ;;
            esac
        done
        exec 4<&-

        exec 3< "${PAIRS}"
        while IFS='|' read -r apk_url expected_hash package_name version_code package_format force_install <&3; do
                [ -n "${apk_url}" ] || continue
                remote_found=1
                remote_index=$((remote_index + 1))

                case "${force_install}" in
                    true|false) ;;
                    *) log_message "remote: invalid forceInstall for ${apk_url}: ${force_install}"; remote_failed=1; continue ;;
                esac
                case "${package_format}" in
                    apk|splitZip) ;;
                    *) log_message "remote: invalid format for ${apk_url}: ${package_format}"; remote_failed=1; continue ;;
                esac

                invalid_package=$(echo "${package_name}" | tr -d 'A-Za-z0-9._')
                invalid_version=$(echo "${version_code}" | tr -d '0-9')
                if [ -z "${package_name}" ] || [ -n "${invalid_package}" ]; then
                    log_message "remote: invalid packageName: ${package_name}"
                    remote_failed=1
                    continue
                fi
                if [ -z "${version_code}" ] || [ -n "${invalid_version}" ]; then
                    log_message "remote: invalid versionCode for ${package_name}: ${version_code}"
                    remote_failed=1
                    continue
                fi

                package_marker=${REMOTE_PACKAGE_STATE}/${package_name}
                package_installed=0
                installed_path=$("${PM}" path "${package_name}" 2>/dev/null)
                case "${installed_path}" in package:*) package_installed=1 ;; esac

                if [ "${package_installed}" -eq 1 ]; then
                    installed_version=$("${PM}" dump "${package_name}" 2>/dev/null |
                        "${AWK}" '/versionCode=/{sub(/^.*versionCode=/, ""); sub(/[[:space:]].*$/, ""); print; exit}')
                    invalid_installed_version=$(echo "${installed_version}" | tr -d '0-9')
                    if [ -z "${installed_version}" ] || [ -n "${invalid_installed_version}" ]; then
                        log_message "remote: cannot read installed versionCode: ${package_name}"
                        remote_failed=1
                        continue
                    fi
                    touch "${package_marker}"
                    if [ "${version_code}" -le "${installed_version}" ]; then
                        log_message "remote: current ${package_name} installed=${installed_version} server=${version_code}"
                        continue
                    fi
                    log_message "remote: updating ${package_name} ${installed_version} -> ${version_code}"
                elif [ "${force_install}" = true ]; then
                    log_message "remote: enforced package missing; reinstalling ${package_name}"
                elif [ -e "${package_marker}" ]; then
                    log_message "remote: ${package_name} was removed by user; skipping"
                    continue
                else
                    log_message "remote: first install ${package_name} versionCode=${version_code}"
                fi

                case "${apk_url}" in
                    "${REMOTE_URL_PREFIX}"*) ;;
                    *)
                        log_message "remote: rejected URL outside allowlist: ${apk_url}"
                        remote_failed=1
                        continue
                        ;;
                esac

                clean_hash=$(echo "${expected_hash}" | tr 'A-F' 'a-f')
                invalid_hash=$(echo "${clean_hash}" | tr -d '0-9a-f')
                if [ "${#clean_hash}" -ne 64 ] || [ -n "${invalid_hash}" ]; then
                    log_message "remote: invalid SHA-256 for ${apk_url}"
                    remote_failed=1
                    continue
                fi

                local_hash_match=0
                matching_local_apk=
                for local_dir in ${PKG_DIRS}; do
                    [ -d "${local_dir}" ] || continue
                    for local_apk in "${local_dir}"/*.apk "${local_dir}"/*.APK "${local_dir}"/*.zip "${local_dir}"/*.ZIP; do
                        [ -f "${local_apk}" ] || continue
                        local_hash=$("${SHA256}" "${local_apk}" 2>/dev/null | "${AWK}" '{print $1}')
                        local_hash=$(echo "${local_hash}" | tr 'A-F' 'a-f')
                        if [ "${local_hash}" = "${clean_hash}" ]; then
                            local_hash_match=1
                            matching_local_apk=${local_apk}
                            break
                        fi
                    done
                    [ "${local_hash_match}" -eq 0 ] || break
                done
                if [ "${local_hash_match}" -ne 0 ]; then
                    log_message "remote: installing selected version from local APK: ${matching_local_apk}"
                    if install_remote_payload "${package_format}" "${matching_local_apk}" "${REMOTE_DIR}/split_${remote_index}"; then
                        touch "${package_marker}"
                    else
                        remote_failed=1
                    fi
                    continue
                fi

                case "${package_format}" in
                    apk) remote_apk=${REMOTE_DIR}/remote_${remote_index}.apk ;;
                    splitZip) remote_apk=${REMOTE_DIR}/remote_${remote_index}.zip ;;
                esac
                rm -f "${remote_apk}"
                if ! download_file "${apk_url}" "${remote_apk}" 536870912 3; then
                    log_message "remote: APK download failed: ${package_name}"
                    remote_failed=1
                    continue
                fi

                actual_hash=$("${SHA256}" "${remote_apk}" 2>/dev/null | "${AWK}" '{print $1}')
                actual_hash=$(echo "${actual_hash}" | tr 'A-F' 'a-f')
                if [ "${actual_hash}" != "${clean_hash}" ]; then
                    log_message "remote: SHA-256 mismatch: ${apk_url}"
                    rm -f "${remote_apk}"
                    remote_failed=1
                    continue
                fi

                if install_remote_payload "${package_format}" "${remote_apk}" "${REMOTE_DIR}/split_${remote_index}"; then
                    installed_after=$("${PM}" dump "${package_name}" 2>/dev/null |
                        "${AWK}" '/versionCode=/{sub(/^.*versionCode=/, ""); sub(/[[:space:]].*$/, ""); print; exit}')
                    if [ "${installed_after}" = "${version_code}" ]; then
                        touch "${package_marker}"
                        log_message "remote: verified ${package_name} versionCode=${installed_after}"
                    else
                        log_message "remote: version verification failed ${package_name}: expected=${version_code} actual=${installed_after}"
                        remote_failed=1
                    fi
                else
                    remote_failed=1
                fi
                rm -f "${remote_apk}"
        done
        exec 3<&-

        if [ "${remote_found}" -eq 0 ]; then
            log_message "remote: manifest contains no packages"
            remote_failed=1
        fi
        if [ "${remote_failed}" -eq 0 ] && [ -n "${manifest_hash}" ]; then
            if [ "${manifest_changed}" -ne 0 ]; then
                echo "${manifest_hash}" > "${REMOTE_STATE}.tmp"
                mv "${REMOTE_STATE}.tmp" "${REMOTE_STATE}"
                log_message "remote: complete manifest=${manifest_hash}"
            else
                log_message "remote: enforced package check complete"
            fi
        else
            failed=1
            log_message "remote: incomplete; retrying next boot"
        fi
    fi
fi

rm -f "${REMOTE_DIR}"/*.apk "${REMOTE_DIR}"/*.zip "${REMOTE_DIR}"/*.part
if [ "${failed}" -ne 0 ]; then
    log_message "preinstall: finished with errors"
    exit 1
fi
log_message "preinstall: complete"
exit 0
