#!/system/bin/sh
# APK Server V2 installer. This file is interpreted by /system/bin/sh from init.

PKG_DIRS="/product/preinstall /system/preinstall"
LOCAL_MARK=/data/local/tmp/.product_preinstall_done
LOG=/data/local/tmp/product_preinstall.log
PM=/system/bin/pm
REMOTE_HELPER=/system/framework/remote-preinstall.jar
REMOTE_DIR=/data/local/tmp/remote_preinstall
REMOTE_STATE=/data/local/tmp/.remote_preinstall_manifest_sha256
REMOTE_PACKAGE_STATE=/data/local/tmp/remote_preinstall_packages
SHA256=/system/bin/sha256sum
AWK=/system/bin/awk
TIMEOUT=/system/bin/timeout
UNZIP=$(command -v unzip 2>/dev/null)
MAX_MANIFEST_BYTES=1048576
MAX_PAYLOAD_BYTES=536870912
APP_FILES=/sdcard/Android/data/com.daivietpda.preinstallmanager/files
UI_DIR=${APP_FILES}/preinstall-v2
UI_STATUS=${UI_DIR}/status.json
UI_LOG=${UI_DIR}/ui.log
RUN_ID="$(date '+%Y%m%d-%H%M%S')-$$"
CURRENT_ENDPOINT="failover-auto"
TELEMETRY_QUEUE=/data/local/tmp/preinstall-v2-telemetry
TELEMETRY_SEQUENCE=0
TELEMETRY_MAX_PENDING=200

prepare_ui() {
    mkdir -p "${UI_DIR}" 2>/dev/null || return 0
    [ -f "${UI_LOG}" ] || : > "${UI_LOG}" 2>/dev/null
}

clean_text() {
    echo "$1" | tr -d '\r\n"' | sed 's/\\/\\\\/g'
}

telemetry_text() {
    printf '%s' "$1" | tr -d '\r\n|' | cut -c 1-240
}

# Queue-only by design: telemetry never waits for network and never changes installer result.
queue_telemetry() {
    event="$1"; event_state="$2"; event_phase="$3"; event_package="$4"; event_version="$5"; event_message="$6"
    mkdir -p "${TELEMETRY_QUEUE}" 2>/dev/null || return 0
    pending=0
    for pending_file in "${TELEMETRY_QUEUE}"/*.event; do
        [ -f "${pending_file}" ] || continue
        pending=$((pending + 1))
        [ "${pending}" -ge "${TELEMETRY_MAX_PENDING}" ] && return 0
    done
    TELEMETRY_SEQUENCE=$((TELEMETRY_SEQUENCE + 1))
    event_time=$(date '+%s')
    event_file="${TELEMETRY_QUEUE}/${event_time}-$$-${TELEMETRY_SEQUENCE}.event"
    printf '%s|%s|%s|%s|%s|%s|%s|%s|%s|%s\n' \
        "${event_time}" "$(telemetry_text "${event}")" "$(telemetry_text "${RUN_ID}")" \
        "$(telemetry_text "${event_state}")" "$(telemetry_text "${event_phase}")" \
        "$(telemetry_text "${event_package}")" "$(telemetry_text "${event_version}")" \
        "$(telemetry_text "${RELEASE_ID}")" "$(telemetry_text "${CURRENT_ENDPOINT}")" \
        "$(telemetry_text "${event_message}")" > "${event_file}.tmp" 2>/dev/null && \
        mv "${event_file}.tmp" "${event_file}" 2>/dev/null
}

publish_status() {
    state="$1"; phase="$2"; package_name="$3"; message="$4"
    [ -d "${UI_DIR}" ] || return 0
    now="$(date '+%Y-%m-%dT%H:%M:%S%z')"
    printf '{"schemaVersion":1,"runId":"%s","state":"%s","phase":"%s","releaseId":"%s","endpoint":"%s","packageName":"%s","message":"%s","updatedAt":"%s"}\n' \
        "$(clean_text "${RUN_ID}")" "$(clean_text "${state}")" "$(clean_text "${phase}")" \
        "$(clean_text "${RELEASE_ID}")" "$(clean_text "${CURRENT_ENDPOINT}")" "$(clean_text "${package_name}")" \
        "$(clean_text "${message}")" "${now}" > "${UI_STATUS}.tmp" 2>/dev/null && mv "${UI_STATUS}.tmp" "${UI_STATUS}" 2>/dev/null
}

log_message() {
    line="$(date '+%Y-%m-%d %H:%M:%S') $*"
    echo "${line}" >> "${LOG}"
    [ -d "${UI_DIR}" ] || return 0
    echo "${line}" >> "${UI_LOG}" 2>/dev/null
    ui_size=$(wc -c < "${UI_LOG}" 2>/dev/null)
    if [ -n "${ui_size}" ] && [ "${ui_size}" -gt 65536 ]; then
        tail -n 200 "${UI_LOG}" > "${UI_LOG}.tmp" 2>/dev/null && mv "${UI_LOG}.tmp" "${UI_LOG}" 2>/dev/null
    fi
}

install_apk() {
    apk_path="$1"
    log_message "preinstall: installing ${apk_path}"
    if "${PM}" install -r -g "${apk_path}" >> "${LOG}" 2>&1; then
        log_message "preinstall: installed ${apk_path}"
        return 0
    fi
    log_message "preinstall: FAILED ${apk_path}"
    return 1
}

install_split_zip() {
    zip_path="$1"; extract_dir="$2"
    if [ -z "${UNZIP}" ]; then log_message "preinstall: unzip command is unavailable"; return 1; fi
    rm -rf "${extract_dir}"; mkdir -p "${extract_dir}" || return 1
    if ! "${UNZIP}" -o "${zip_path}" -d "${extract_dir}" >> "${LOG}" 2>&1; then
        log_message "preinstall: failed to extract ${zip_path}"; rm -rf "${extract_dir}"; return 1
    fi
    [ -f "${extract_dir}/base.apk" ] || { log_message "preinstall: split ZIP has no root base.apk: ${zip_path}"; rm -rf "${extract_dir}"; return 1; }
    set -- "${extract_dir}"/*.apk; split_count=0
    for split_apk in "$@"; do
        [ -f "${split_apk}" ] || continue
        split_count=$((split_count + 1))
    done
    [ "${split_count}" -gt 0 ] && [ "${split_count}" -le 64 ] || { log_message "preinstall: invalid split count"; rm -rf "${extract_dir}"; return 1; }
    create_result=$("${PM}" install-create -r -g 2>&1); echo "${create_result}" >> "${LOG}"
    session_id=$(echo "${create_result}" | "${AWK}" -F'[][]' '/Success.*session/{print $2; exit}')
    invalid_session=$(echo "${session_id}" | tr -d '0-9')
    [ -n "${session_id}" ] && [ -z "${invalid_session}" ] || { log_message "preinstall: failed to create split install session"; rm -rf "${extract_dir}"; return 1; }
    split_failed=0
    for split_apk in "$@"; do
        [ -f "${split_apk}" ] || continue
        split_name=${split_apk##*/}; split_size=$(wc -c < "${split_apk}" 2>/dev/null)
        if ! "${PM}" install-write -S "${split_size}" "${session_id}" "${split_name}" "${split_apk}" >> "${LOG}" 2>&1; then split_failed=1; break; fi
    done
    if [ "${split_failed}" -eq 0 ] && "${PM}" install-commit "${session_id}" >> "${LOG}" 2>&1; then
        log_message "preinstall: installed split package ${zip_path}"; rm -rf "${extract_dir}"; return 0
    fi
    "${PM}" install-abandon "${session_id}" >> "${LOG}" 2>&1
    log_message "preinstall: FAILED split package ${zip_path} session=${session_id}"; rm -rf "${extract_dir}"; return 1
}

install_remote_payload() {
    case "$1" in apk) install_apk "$2" ;; splitZip) install_split_zip "$2" "$3" ;; *) log_message "remote: unsupported format: $1"; return 1 ;; esac
}

download_relative_file() {
    relative_path="$1"; destination="$2"; max_bytes="$3"; attempts="$4"; attempt=1
    while [ "${attempt}" -le "${attempts}" ]; do
        rm -f "${destination}.part"
        log_message "remote: download attempt ${attempt}: ${relative_path}"
        download_output=$(REMOTE_FETCH_PREFERRED_ENDPOINT="${CURRENT_ENDPOINT}" CLASSPATH="${REMOTE_HELPER}" "${TIMEOUT}" 180 /system/bin/app_process /system/bin RemoteFetchV2 \
            --relative "${relative_path}" "${destination}.part" "${max_bytes}" 2>&1)
        download_result=$?
        echo "${download_output}" >> "${LOG}"
        selected_endpoint=$(echo "${download_output}" | "${AWK}" '/RemoteFetchV2: success endpoint=/{sub(/^.*endpoint=/, ""); sub(/ path=.*/, ""); print; exit}')
        if [ -n "${selected_endpoint}" ]; then CURRENT_ENDPOINT="${selected_endpoint}"; log_message "remote: selected endpoint ${CURRENT_ENDPOINT}"; fi
        if [ "${download_result}" -eq 0 ] && [ -s "${destination}.part" ]; then
            mv "${destination}.part" "${destination}"; return 0
        fi
        rm -f "${destination}.part"; attempt=$((attempt + 1)); sleep 10
    done
    return 1
}

installed_version() {
    "${PM}" dump "$1" 2>/dev/null | "${AWK}" '/versionCode=/{sub(/^.*versionCode=/, ""); sub(/[[:space:]].*$/, ""); print; exit}'
}

prepare_ui
RELEASE_ID=""
publish_status running local-scan "" "Starting preinstall"
log_message "preinstall: start uid=$(id -u) context=$(id -Z 2>/dev/null) selinux=$(/system/bin/getenforce 2>/dev/null) runId=${RUN_ID}"
queue_telemetry run_started running local-scan "" "" "Starting preinstall"
failed=0

if [ ! -e "${LOCAL_MARK}" ]; then
    local_failed=0; local_found=0
    for pkg_dir in ${PKG_DIRS}; do
        [ -d "${pkg_dir}" ] || continue
        log_message "preinstall: scanning ${pkg_dir}"
        for apk in "${pkg_dir}"/*.apk "${pkg_dir}"/*.APK; do
            [ -f "${apk}" ] || continue; local_found=1
            publish_status running local-scan "${apk##*/}" "Installing local APK"
            install_apk "${apk}" || local_failed=1
        done
    done
    [ "${local_found}" -ne 0 ] || log_message "preinstall: no local APK files found"
    if [ "${local_failed}" -eq 0 ]; then touch "${LOCAL_MARK}"; log_message "preinstall: local complete"; else failed=1; log_message "preinstall: local incomplete; retrying next boot"; fi
else log_message "preinstall: local marker exists; skipping local APKs"; fi

mkdir -p "${REMOTE_DIR}" "${REMOTE_PACKAGE_STATE}"
MANIFEST=${REMOTE_DIR}/manifest.json; PAIRS=${REMOTE_DIR}/packages.list; UNINSTALLS=${REMOTE_DIR}/uninstall.list
if [ ! -r "${REMOTE_HELPER}" ]; then
    log_message "remote: HTTPS helper missing or unreadable: ${REMOTE_HELPER}"; failed=1
elif ! download_relative_file manifest.json "${MANIFEST}" "${MAX_MANIFEST_BYTES}" 3; then
    log_message "remote: manifest download failed"; queue_telemetry manifest_failed failed manifest "" "" "Manifest download failed"; failed=1
else
    manifest_size=$(wc -c < "${MANIFEST}" 2>/dev/null)
    schema_version=$("${AWK}" -F: '/"schemaVersion"/{gsub(/[^0-9]/,"",$2); print $2; exit}' "${MANIFEST}")
    RELEASE_ID=$("${AWK}" -F'"' '/"releaseId"/{print $4; exit}' "${MANIFEST}")
    if [ -z "${manifest_size}" ] || [ "${manifest_size}" -gt "${MAX_MANIFEST_BYTES}" ] || [ "${schema_version}" != 3 ] || [ -z "${RELEASE_ID}" ]; then
        log_message "remote: invalid V2 manifest size/schema/releaseId"; queue_telemetry manifest_failed failed manifest "" "" "Invalid manifest"; failed=1
    else
        queue_telemetry manifest_loaded running manifest "" "" "Manifest accepted"
        manifest_hash=$("${SHA256}" "${MANIFEST}" 2>/dev/null | "${AWK}" '{print $1}')
        previous_hash=$(cat "${REMOTE_STATE}" 2>/dev/null); manifest_changed=1
        [ -n "${manifest_hash}" ] && [ "${manifest_hash}" = "${previous_hash}" ] && manifest_changed=0
        [ "${manifest_changed}" -eq 1 ] && log_message "remote: new manifest release=${RELEASE_ID}" || log_message "remote: manifest unchanged; checking forced packages"
        "${AWK}" '
            /"uninstallPackages"/ { in_packages=0 }
            /"packages"[[:space:]]*:/ { in_packages=1; next }
            in_packages && /"packageName"/ { v=$0; sub(/.*"packageName"[[:space:]]*:[[:space:]]*"/,"",v); sub(/".*/,"",v); p=v }
            in_packages && /"versionCode"/ { v=$0; gsub(/[^0-9]/,"",v); ver=v }
            in_packages && /"format"/ { v=$0; sub(/.*"format"[[:space:]]*:[[:space:]]*"/,"",v); sub(/".*/,"",v); fmt=v }
            in_packages && /"forceInstall"/ { v=$0; sub(/.*:[[:space:]]*/,"",v); gsub(/[,[:space:]]/,"",v); force=v }
            in_packages && /"path"/ { v=$0; sub(/.*"path"[[:space:]]*:[[:space:]]*"/,"",v); sub(/".*/,"",v); path=v }
            in_packages && /"sha256"/ { v=$0; sub(/.*"sha256"[[:space:]]*:[[:space:]]*"/,"",v); sub(/".*/,"",v); hash=v }
            in_packages && /"size"/ { v=$0; gsub(/[^0-9]/,"",v); size=v }
            in_packages && /^    },?[[:space:]]*$/ && path != "" { print path "|" hash "|" size "|" p "|" ver "|" fmt "|" force; path=hash=size=p=ver=fmt=force="" }
        ' "${MANIFEST}" > "${PAIRS}"
        "${AWK}" '
            /"uninstallPackages"[[:space:]]*:/ { in_uninstall=1; next }
            in_uninstall && /"packageName"/ { v=$0; sub(/.*"packageName"[[:space:]]*:[[:space:]]*"/,"",v); sub(/".*/,"",v); p=v }
            in_uninstall && /"enforce"/ { v=$0; sub(/.*:[[:space:]]*/,"",v); gsub(/[,[:space:]]/,"",v); enforce=v }
            in_uninstall && /"keepData"/ { v=$0; sub(/.*:[[:space:]]*/,"",v); gsub(/[,[:space:]]/,"",v); keep=v }
            in_uninstall && /"userId"/ { v=$0; gsub(/[^0-9]/,"",v); user=v }
            in_uninstall && /^    },?[[:space:]]*$/ && p != "" { print p "|" enforce "|" keep "|" user; p=enforce=keep=user="" }
        ' "${MANIFEST}" > "${UNINSTALLS}"
        remote_failed=0; remote_found=0; remote_index=0
        while IFS='|' read -r uninstall_package uninstall_enforce uninstall_keep_data uninstall_user_id; do
            [ -n "${uninstall_package}" ] || continue
            invalid_package=$(echo "${uninstall_package}" | tr -d 'A-Za-z0-9._'); invalid_user=$(echo "${uninstall_user_id}" | tr -d '0-9')
            case "${uninstall_enforce}:${uninstall_keep_data}" in true:true|true:false|false:true|false:false) ;; *) remote_failed=1; log_message "remote: invalid uninstall rule"; continue ;; esac
            [ -z "${invalid_package}" ] && [ -z "${invalid_user}" ] || { remote_failed=1; log_message "remote: invalid uninstall target"; continue; }
            [ "${uninstall_enforce}" = false ] && [ "${manifest_changed}" -eq 0 ] && continue
            if "${PM}" path --user "${uninstall_user_id}" "${uninstall_package}" 2>/dev/null | grep -q '^package:'; then
                publish_status running uninstall "${uninstall_package}" "Applying uninstall policy"
                queue_telemetry uninstall_started running uninstall "${uninstall_package}" "" "Applying uninstall policy"
                if [ "${uninstall_keep_data}" = true ]; then "${PM}" uninstall -k --user "${uninstall_user_id}" "${uninstall_package}" >> "${LOG}" 2>&1; else "${PM}" uninstall --user "${uninstall_user_id}" "${uninstall_package}" >> "${LOG}" 2>&1; fi
                if "${PM}" path --user "${uninstall_user_id}" "${uninstall_package}" 2>/dev/null | grep -q '^package:'; then
                    remote_failed=1; log_message "remote: FAILED uninstall ${uninstall_package}"; queue_telemetry uninstall_failed failed uninstall "${uninstall_package}" "" "Uninstall failed"
                else
                    log_message "remote: uninstalled ${uninstall_package}"; queue_telemetry uninstall_completed running uninstall "${uninstall_package}" "" "Uninstall completed"
                fi
            fi
        done < "${UNINSTALLS}"
        while IFS='|' read -r payload_path expected_hash payload_size package_name version_code package_format force_install; do
            [ -n "${payload_path}" ] || continue; remote_found=1; remote_index=$((remote_index + 1))
            invalid_package=$(echo "${package_name}" | tr -d 'A-Za-z0-9._'); invalid_version=$(echo "${version_code}" | tr -d '0-9'); invalid_size=$(echo "${payload_size}" | tr -d '0-9')
            case "${package_format}:${force_install}" in apk:true|apk:false|splitZip:true|splitZip:false) ;; *) remote_failed=1; log_message "remote: invalid format/forceInstall"; continue ;; esac
            case "${payload_path}" in payload/*) ;; *) remote_failed=1; log_message "remote: invalid payload path"; continue ;; esac
            [ -z "${invalid_package}" ] && [ -n "${version_code}" ] && [ -z "${invalid_version}" ] && [ -n "${payload_size}" ] && [ -z "${invalid_size}" ] && [ "${payload_size}" -le "${MAX_PAYLOAD_BYTES}" ] || { remote_failed=1; log_message "remote: invalid package metadata"; continue; }
            echo "${expected_hash}" | grep -Eq '^[0-9a-f]{64}$' || { remote_failed=1; log_message "remote: invalid SHA-256 for ${package_name}"; continue; }
            package_marker="${REMOTE_PACKAGE_STATE}/${package_name}"; installed=0
            "${PM}" path "${package_name}" 2>/dev/null | grep -q '^package:' && installed=1
            installed_ver=""; [ "${installed}" -eq 1 ] && installed_ver=$(installed_version "${package_name}")
            need_install=0
            if [ "${installed}" -eq 0 ]; then [ "${force_install}" = true ] || [ ! -e "${package_marker}" ] && need_install=1
            elif [ -z "${installed_ver}" ] || [ "${installed_ver}" -lt "${version_code}" ]; then need_install=1
            else touch "${package_marker}"; fi
            if [ "${need_install}" -eq 0 ]; then log_message "remote: current ${package_name} installed=${installed_ver:-absent} server=${version_code}"; continue; fi
            artifact_name=${payload_path##*/}; remote_artifact="${REMOTE_DIR}/remote_${remote_index}_${artifact_name}"
            publish_status running download-payload "${package_name}" "Downloading payload"
            queue_telemetry download_started running download-payload "${package_name}" "${version_code}" "Downloading payload"
            if ! download_relative_file "${payload_path}" "${remote_artifact}" "${payload_size}" 3; then
                remote_failed=1; log_message "remote: payload download failed ${payload_path}"; queue_telemetry download_failed failed download-payload "${package_name}" "${version_code}" "Payload download failed"; continue
            fi
            actual_size=$(wc -c < "${remote_artifact}" 2>/dev/null); actual_hash=$("${SHA256}" "${remote_artifact}" 2>/dev/null | "${AWK}" '{print $1}')
            if [ "${actual_size}" != "${payload_size}" ] || [ "${actual_hash}" != "${expected_hash}" ]; then
                remote_failed=1; log_message "remote: payload verification failed ${package_name}"; queue_telemetry download_failed failed verify "${package_name}" "${version_code}" "Payload verification failed"; rm -f "${remote_artifact}"; continue
            fi
            queue_telemetry download_completed running verify "${package_name}" "${version_code}" "Payload verified"
            publish_status running install "${package_name}" "Installing verified payload"
            queue_telemetry install_started running install "${package_name}" "${version_code}" "Installing verified payload"
            if install_remote_payload "${package_format}" "${remote_artifact}" "${REMOTE_DIR}/split_${remote_index}"; then
                installed_after=$(installed_version "${package_name}")
                if [ "${installed_after}" = "${version_code}" ]; then
                    touch "${package_marker}"; log_message "remote: installed ${package_name} version=${version_code}"; queue_telemetry install_completed running install "${package_name}" "${version_code}" "Install completed"
                else
                    remote_failed=1; log_message "remote: version verification failed ${package_name} expected=${version_code} actual=${installed_after}"; queue_telemetry install_failed failed verify "${package_name}" "${version_code}" "Installed version verification failed"
                fi
            else
                remote_failed=1; queue_telemetry install_failed failed install "${package_name}" "${version_code}" "Package install failed"
            fi
            rm -f "${remote_artifact}"
        done < "${PAIRS}"
        [ "${remote_found}" -ne 0 ] || { remote_failed=1; log_message "remote: manifest contains no packages"; }
        if [ "${remote_failed}" -eq 0 ] && [ -n "${manifest_hash}" ]; then echo "${manifest_hash}" > "${REMOTE_STATE}.tmp" && mv "${REMOTE_STATE}.tmp" "${REMOTE_STATE}"; log_message "remote: complete release=${RELEASE_ID}"; else failed=1; log_message "remote: incomplete; retrying next boot"; fi
    fi
fi
rm -f "${REMOTE_DIR}"/*.apk "${REMOTE_DIR}"/*.zip "${REMOTE_DIR}"/*.part
if [ "${failed}" -ne 0 ]; then
    publish_status failed error "" "Preinstall finished with errors"; log_message "preinstall: finished with errors"; queue_telemetry run_failed failed error "" "" "Preinstall finished with errors"; exit 1
fi
publish_status complete complete "" "Preinstall complete"; log_message "preinstall: complete"; queue_telemetry run_completed complete complete "" "" "Preinstall complete"; exit 0
