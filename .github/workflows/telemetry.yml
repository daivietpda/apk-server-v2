name: Test and deploy V2 telemetry

on:
  push:
    branches: [master]
    paths:
      - 'telemetry/**'
      - 'client/remote-fetch/**'
      - 'rom-integration/product/preinstall/**'
      - '.github/workflows/telemetry.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy Worker and apply D1 migrations'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test Worker and client sources
        run: |
          (cd telemetry && node --test)
          node --check telemetry/src/worker.js
          python3 -m py_compile client/remote-fetch/build_remote_fetch.py
          javac -source 8 -target 8 -d /tmp/preinstall-classes \
            client/remote-fetch/RemoteFetchV2.java \
            client/remote-fetch/TelemetryV2.java
          sh -n rom-integration/product/preinstall/factoryreset.conf
          sh -n rom-integration/product/preinstall/preinstall-listener.conf

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: test
    runs-on: ubuntu-latest
    environment: telemetry-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate deployment secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.TELEMETRY_D1_DATABASE_ID }}
          INGEST_TOKEN: ${{ secrets.TELEMETRY_INGEST_TOKEN }}
          DASHBOARD_TOKEN: ${{ secrets.TELEMETRY_DASHBOARD_TOKEN }}
        run: |
          for value in "$CF_API_TOKEN" "$CF_ACCOUNT_ID" "$D1_DATABASE_ID" "$INGEST_TOKEN" "$DASHBOARD_TOKEN"; do
            test -n "$value" || { echo 'A required telemetry secret is missing' >&2; exit 2; }
          done
          test "${#INGEST_TOKEN}" -ge 32
          test "${#DASHBOARD_TOKEN}" -ge 24
      - name: Render private Wrangler configuration
        env:
          D1_DATABASE_ID: ${{ secrets.TELEMETRY_D1_DATABASE_ID }}
        run: |
          cp telemetry/wrangler.toml.example telemetry/wrangler.toml
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$D1_DATABASE_ID/" telemetry/wrangler.toml
      - name: Apply D1 migrations and configure Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INGEST_TOKEN: ${{ secrets.TELEMETRY_INGEST_TOKEN }}
          DASHBOARD_TOKEN: ${{ secrets.TELEMETRY_DASHBOARD_TOKEN }}
        run: |
          npx --yes wrangler@4 d1 migrations apply apk-server-v2-telemetry --remote --config telemetry/wrangler.toml
          printf '%s' "$INGEST_TOKEN" | npx --yes wrangler@4 secret put INGEST_TOKEN --config telemetry/wrangler.toml
          printf '%s' "$DASHBOARD_TOKEN" | npx --yes wrangler@4 secret put DASHBOARD_TOKEN --config telemetry/wrangler.toml
          npx --yes wrangler@4 deploy --config telemetry/wrangler.toml
      - name: Verify public health endpoint
        run: curl --fail --retry 5 --retry-delay 5 https://apk.daivietpda.com/api/v2/health
