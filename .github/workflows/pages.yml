name: Build manifest and publish APK server V2

on:
  push:
    branches: [master]
    paths:
      - 'server/apk/**'
      - 'server/manifest-policy.json'
      - 'server/uninstall-policy.json'
      - 'server/scripts/**'
      - 'server/requirements-publish.txt'
      - 'server/tests/**'
      - 'client/remote-fetch/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      apk_file:
        description: 'Install group: exact APK/ZIP filename; empty means rebuild all'
        required: false
        type: string
      package_name:
        description: 'Install group: Android packageName; required for force_install=true'
        required: false
        type: string
      force_install:
        description: 'Install group: forced reinstall policy'
        required: true
        default: unchanged
        type: choice
        options: [unchanged, 'true', 'false']
      uninstall_package:
        description: 'Uninstall group: Android packageName to remove'
        required: false
        type: string
      uninstall_action:
        description: 'Uninstall group: remote uninstall policy'
        required: true
        default: unchanged
        type: choice
        options: [unchanged, once, enforce, remove]
      uninstall_keep_data:
        description: 'Uninstall group: keep app data with pm uninstall -k'
        required: true
        default: false
        type: boolean
      uninstall_user_id:
        description: 'Uninstall group: Android user ID, normally 0 on Android TV'
        required: true
        default: '0'
        type: string

permissions:
  contents: read

concurrency:
  group: apk-server-v2-release
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install Android build tools
        run: sdkmanager 'build-tools;35.0.1'
      - name: Apply requested policy and generate manifest schema v3
        shell: bash
        env:
          APK_FILE: ${{ inputs.apk_file }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          FORCE_INSTALL: ${{ inputs.force_install }}
          UNINSTALL_PACKAGE: ${{ inputs.uninstall_package }}
          UNINSTALL_ACTION: ${{ inputs.uninstall_action }}
          UNINSTALL_KEEP_DATA: ${{ inputs.uninstall_keep_data }}
          UNINSTALL_USER_ID: ${{ inputs.uninstall_user_id }}
        run: |
          APK_FILE="${APK_FILE:-}"
          PACKAGE_NAME="${PACKAGE_NAME:-}"
          FORCE_INSTALL="${FORCE_INSTALL:-unchanged}"
          UNINSTALL_PACKAGE="${UNINSTALL_PACKAGE:-}"
          UNINSTALL_ACTION="${UNINSTALL_ACTION:-unchanged}"
          UNINSTALL_KEEP_DATA="${UNINSTALL_KEEP_DATA:-false}"
          UNINSTALL_USER_ID="${UNINSTALL_USER_ID:-0}"

          python3 -m py_compile \
            server/scripts/update_manifest.py \
            server/scripts/build_public.py \
            server/scripts/publish_r2.py \
            server/scripts/verify_release.py \
            client/remote-fetch/build_remote_fetch.py
          python3 -m unittest discover -s server/tests -v

          args=(--aapt2 "$ANDROID_HOME/build-tools/35.0.1/aapt2")
          if [[ "$FORCE_INSTALL" != "unchanged" ]]; then
            if [[ -z "$APK_FILE" ]]; then
              echo "apk_file is required when force_install is true or false" >&2
              exit 2
            fi
            args+=(--set-apk "$APK_FILE" --package-name "$PACKAGE_NAME" --force-install "$FORCE_INSTALL")
          elif [[ -n "$APK_FILE" ]]; then
            echo "Rebuilding all payload metadata; forceInstall for $APK_FILE is unchanged"
          fi

          if [[ "$UNINSTALL_ACTION" != "unchanged" ]]; then
            if [[ -z "$UNINSTALL_PACKAGE" ]]; then
              echo "uninstall_package is required when uninstall_action is not unchanged" >&2
              exit 2
            fi
            args+=(--uninstall-package "$UNINSTALL_PACKAGE" \
              --uninstall-action "$UNINSTALL_ACTION" \
              --uninstall-keep-data "$UNINSTALL_KEEP_DATA" \
              --uninstall-user-id "$UNINSTALL_USER_ID")
          elif [[ -n "$UNINSTALL_PACKAGE" ]]; then
            echo "Ignoring uninstall_package because uninstall_action is unchanged"
          fi

          python3 server/scripts/update_manifest.py "${args[@]}"

      - name: Build immutable RemoteFetchV2 DEX jar
        shell: bash
        run: |
          mkdir -p build
          curl --fail --location --retry 3 \
            --output build/r8.jar \
            https://storage.googleapis.com/r8-releases/raw/9.1.31/r8.jar
          echo 'a71d9a085361aa6912979a0101030a7e47fec91d6ac3a958454e21e4a31d6cce  build/r8.jar' | sha256sum --check --
          python3 client/remote-fetch/build_remote_fetch.py \
            --r8-jar build/r8.jar \
            --output build/remote-preinstall.jar

      - name: Assemble and validate public release layout
        shell: bash
        run: |
          python3 server/scripts/build_public.py \
            --remote-jar build/remote-preinstall.jar \
            --output server/public
          touch server/public/.nojekyll
          test -s server/public/manifest.json
          test -s server/public/remote-preinstall.jar

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: server/public
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v2-public-layout
          path: server/public
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v2-generated-policies
          path: |
            server/manifest.json
            server/manifest-policy.json
            server/uninstall-policy.json
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v2-rom-artifacts
          path: |
            build/remote-preinstall.jar
            server/manifest.json
            server/manifest-policy.json
            server/uninstall-policy.json
          if-no-files-found: error

  commit_manifest:
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: v2-generated-policies
          path: generated
      - name: Commit generated policy and manifest
        shell: bash
        run: |
          cp generated/server/manifest.json server/manifest.json
          cp generated/server/manifest-policy.json server/manifest-policy.json
          cp generated/server/uninstall-policy.json server/uninstall-policy.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/manifest.json server/manifest-policy.json server/uninstall-policy.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update generated V2 APK manifest and policies'
            git push origin HEAD:master
          else
            echo 'Manifest and policies are already current'
          fi

  deploy_pages:
    permissions:
      pages: write
      id-token: write
    needs: [build, commit_manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  publish_r2:
    permissions:
      contents: read
    if: vars.R2_PUBLISH_ENABLED == 'true'
    needs: [build, commit_manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: r2-shadow
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: v2-public-layout
          path: server/public
      - name: Create isolated publisher environment
        run: python3 -m venv .venv-publisher
      - name: Install locked publisher dependencies
        run: |
          .venv-publisher/bin/python -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            --require-hashes \
            --only-binary=:all: \
            --no-deps \
            -r server/requirements-publish.txt
      - name: Publish payload first and manifest last
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
        run: |
          .venv-publisher/bin/python server/scripts/publish_r2.py \
            --public-dir server/public \
            --bucket "$R2_BUCKET_NAME"
      - name: Verify R2 shadow release
        env:
          R2_SHADOW_BASE_URL: ${{ vars.R2_SHADOW_BASE_URL }}
        run: |
          python3 server/scripts/verify_release.py \
            --public-dir server/public \
            --base-url "$R2_SHADOW_BASE_URL"

  verify_dual_origin:
    permissions:
      contents: read
    if: vars.R2_PUBLISH_ENABLED == 'true'
    needs: [build, deploy_pages, publish_r2]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: v2-public-layout
          path: server/public
      - name: Verify R2 production, shadow and GitHub Pages expose the same release
        env:
          R2_SHADOW_BASE_URL: ${{ vars.R2_SHADOW_BASE_URL }}
        run: |
          python3 server/scripts/verify_release.py \
            --public-dir server/public \
            --base-url 'https://apk.daivietpda.com/' \
            --base-url "$R2_SHADOW_BASE_URL" \
            --base-url 'https://daivietpda.github.io/apk-server-v2/'
